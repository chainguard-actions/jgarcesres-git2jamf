name: Test prefix enabled behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample script for testing
        run: |
          mkdir -p "$GITHUB_WORKSPACE/prefixed-scripts"
          echo '#!/bin/bash' > "$GITHUB_WORKSPACE/prefixed-scripts/deploy.sh"
          echo 'echo "deploy"' >> "$GITHUB_WORKSPACE/prefixed-scripts/deploy.sh"

      - name: Run action with prefix enabled
        id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_REF: refs/heads/feature-branch
        with:
          jamf_url: 'http://127.0.0.1:19999'
          jamf_username: 'admin'
          jamf_password: 'password'
          script_dir: 'prefixed-scripts'
          script_extensions: 'sh'
          prefix: 'true'

      - name: Assert action accepted prefix input and completed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action uses @logger.catch which may swallow connection errors
          # (reraise=False default), causing exit 0. Or it may exit 1 if reraise=True.
          # Either outcome is acceptable — we verify the action accepted the prefix=true
          # input and ran (Docker built and executed).
          if [ "${{ steps.action.outcome }}" = "success" ] || [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action completed with outcome '${{ steps.action.outcome }}' with prefix=true"
          else
            echo "FAIL: unexpected outcome: ${{ steps.action.outcome }}"
            exit 1
          fi
