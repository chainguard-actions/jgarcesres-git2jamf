name: Test duplicate script name detection
# Tests that the action detects duplicate script names (same base name,
# different extensions) and exits with failure BEFORE attempting to connect
# to JAMF. The action calls sys.exit(1) for duplicates, which is not caught
# by @logger.catch (which only catches Exception, not SystemExit/BaseException).
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create scripts with duplicate base names
        run: |
          # Scripts must be in a subdirectory because the action uses
          # glob pattern "{script_dir}/**/*.{ext}" which requires at least
          # one subdirectory level below script_dir.
          # Create two scripts with the same base name but different extensions.
          # The action strips extensions and lowercases names, so "myscript.sh"
          # and "myscript.py" both become "myscript" — a duplicate.
          mkdir -p "$GITHUB_WORKSPACE/scripts/subdir"
          echo '#!/bin/sh' > "$GITHUB_WORKSPACE/scripts/subdir/myscript.sh"
          echo 'echo hello from sh' >> "$GITHUB_WORKSPACE/scripts/subdir/myscript.sh"
          echo '#!/usr/bin/env python3' > "$GITHUB_WORKSPACE/scripts/subdir/myscript.py"
          echo 'print("hello from py")' >> "$GITHUB_WORKSPACE/scripts/subdir/myscript.py"

      - id: action
        name: Run action with duplicate script names (expected to fail)
        uses: .
        continue-on-error: true
        with:
          jamf_url: "https://localhost:19999"
          jamf_username: "invalid_user"
          jamf_password: "invalid_password"
          script_dir: "scripts"
          script_extensions: "sh py"
          prefix: "false"
          delete: "false"

      - name: Assert action failed due to duplicate script names
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action calls sys.exit(1) when duplicate script names are found.
          # sys.exit() raises SystemExit which is NOT caught by @logger.catch
          # (which only catches Exception subclasses). So the action exits with
          # code 1, resulting in outcome: failure.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when duplicate script names are detected, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly detected duplicate script names and exited with failure"
