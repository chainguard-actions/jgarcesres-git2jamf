name: Test multiple script extensions - sh and py files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test script directory with multiple script types
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-scripts"
          printf '#!/bin/bash\necho "hello from bash"\n' > "$GITHUB_WORKSPACE/test-scripts/hello.sh"
          printf '#!/usr/bin/env python3\nprint("hello from python")\n' > "$GITHUB_WORKSPACE/test-scripts/hello.py"

      - id: action
        uses: .
        continue-on-error: true
        with:
          jamf_url: "http://localhost:9999"
          jamf_username: "testuser"
          jamf_password: "testpassword"
          jamf_auth_type: "auth"
          script_dir: "test-scripts"
          script_extensions: "sh py"
          prefix: "false"
          delete: "false"

      - name: Assert action ran with a definitive outcome (multiple extensions path exercised)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced a definitive outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
