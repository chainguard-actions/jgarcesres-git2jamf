name: Test invalid auth_type error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          jamf_url: 'https://invalid.jamf.example.com'
          jamf_username: 'testuser'
          jamf_password: 'testpassword'
          jamf_auth_type: 'invalid_auth_type'
          script_dir: '${{ github.workspace }}'
          script_extensions: 'sh py'
          prefix: 'false'
          delete: 'false'

      - name: Assert action completed despite invalid auth_type
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action logs an error for invalid auth_type but does not exit.
          # Subsequent errors (NameError in get_jamf_token, ConnectionError) are
          # swallowed by @logger.catch decorators, so the action exits 0 (success).
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to exit 0 (success) since errors are swallowed by @logger.catch, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action completed with exit 0 as expected when given invalid auth_type"
