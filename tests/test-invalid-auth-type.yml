name: Test invalid auth type
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test script file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/scripts"
          echo '#!/bin/sh' > "$GITHUB_WORKSPACE/scripts/test-script.sh"
          echo 'echo hello' >> "$GITHUB_WORKSPACE/scripts/test-script.sh"

      - name: Run action with invalid auth type
        id: action
        continue-on-error: true
        uses: .
        with:
          jamf_url: "http://invalid-jamf-host.example.invalid"
          jamf_username: "testuser"
          jamf_password: "testpassword"
          jamf_auth_type: "invalid_auth_type"
          script_dir: "scripts"
          script_extensions: "sh"
          delete: "false"

      - name: Assert action ran (invalid auth type logs error but does not exit)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action logs an error for invalid auth_type but does not call sys.exit().
          # Subsequent connection errors are swallowed by @logger.catch. Action exits 0.
          if [ "${{ steps.action.outcome }}" != "success" ]; then
            echo "FAIL: expected action to exit 0 (invalid auth type is logged but not fatal)"
            exit 1
          fi
          echo "PASS: action ran and exited cleanly despite invalid auth type"
