name: Test EA script directory processing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create test scripts directories
        run: |
          mkdir -p /tmp/test-scripts-ea
          mkdir -p /tmp/test-ea-scripts
          echo '#!/bin/bash\necho hello' > /tmp/test-scripts-ea/hello.sh
          echo '#!/bin/bash\necho ea-script' > /tmp/test-ea-scripts/ea-check.sh
      - id: action
        uses: .
        continue-on-error: true
        with:
          jamf_url: "http://localhost:8080"
          jamf_username: "testuser"
          jamf_password: "testpassword"
          script_dir: "/tmp/test-scripts-ea"
          ea_script_dir: "/tmp/test-ea-scripts"
          script_extensions: "sh"
          prefix: "false"
          delete: "false"
      - name: Assert action ran with EA script dir set
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should fail because JAMF is not available
          # We expect 'failure' since there's no real JAMF instance
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (no JAMF instance available)"
          else
            echo "PASS: action ran (outcome: $OUTCOME)"
          fi
