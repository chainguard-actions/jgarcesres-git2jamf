name: Test basic usage - connect to JAMF
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create test scripts directory
        run: |
          mkdir -p /tmp/test-scripts
          echo '#!/bin/bash\necho hello' > /tmp/test-scripts/hello.sh
      - id: action
        uses: .
        continue-on-error: true
        with:
          jamf_url: "http://localhost:8080"
          jamf_username: "testuser"
          jamf_password: "testpassword"
          script_dir: "/tmp/test-scripts"
          script_extensions: "sh"
          prefix: "false"
          delete: "false"
      - name: Assert action attempted to connect to JAMF
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should fail because JAMF is not available, not due to misconfiguration
          # We expect 'failure' since there's no real JAMF instance
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (no JAMF instance available)"
          else
            echo "PASS: action succeeded unexpectedly (outcome: $OUTCOME)"
          fi
