name: Test custom script directory input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test scripts in a custom directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/my-scripts/subdir"
          echo '#!/bin/bash' > "$GITHUB_WORKSPACE/my-scripts/deploy.sh"
          echo 'echo deploy' >> "$GITHUB_WORKSPACE/my-scripts/deploy.sh"
          echo '#!/usr/bin/env python3' > "$GITHUB_WORKSPACE/my-scripts/subdir/check.py"
          echo 'print("check")' >> "$GITHUB_WORKSPACE/my-scripts/subdir/check.py"

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        name: Run action with custom script_dir
        uses: .
        continue-on-error: true
        env:
          GITHUB_REF: refs/heads/main
        with:
          jamf_url: "http://127.0.0.1:19999"
          jamf_username: "testuser"
          jamf_password: "testpassword"
          script_dir: "my-scripts"
          script_extensions: "sh py"

      - name: Assert action ran with custom script_dir input accepted
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action uses @logger.catch which swallows connection errors and exits 0.
          # We accept either success (errors swallowed) or failure (unhandled error).
          # The key assertion is that the action ran at all (inputs were parsed correctly).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with custom script_dir and produced a deterministic outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
