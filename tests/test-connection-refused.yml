name: Test JAMF connection refused
# Tests that the action runs without crashing when the JAMF server is
# unreachable (connection refused). The action uses @logger.catch which
# swallows connection exceptions, so it exits with code 0 even on failure.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy script for the action to find
        run: |
          # Scripts must be in a subdirectory because the action uses
          # glob pattern "{script_dir}/**/*.{ext}" which requires at least
          # one subdirectory level below script_dir.
          mkdir -p "$GITHUB_WORKSPACE/scripts/subdir"
          echo '#!/bin/sh' > "$GITHUB_WORKSPACE/scripts/subdir/hello.sh"
          echo 'echo hello world' >> "$GITHUB_WORKSPACE/scripts/subdir/hello.sh"

      - id: action
        name: Run action with unreachable JAMF URL
        uses: .
        continue-on-error: true
        with:
          jamf_url: "https://localhost:19999"
          jamf_username: "testuser"
          jamf_password: "testpassword"
          script_dir: "scripts"
          script_extensions: "sh"
          prefix: "false"
          delete: "false"

      - name: Assert action completed without unexpected crash
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action uses @logger.catch which swallows connection exceptions
          # and exits with code 0 (success). The action should not crash the
          # workflow runner itself.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome: $OUTCOME (connection errors are handled gracefully)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
