name: Test invalid credentials handled gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test script file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/scripts"
          echo '#!/bin/bash' > "$GITHUB_WORKSPACE/scripts/test-script.sh"
          echo 'echo hello' >> "$GITHUB_WORKSPACE/scripts/test-script.sh"

      - id: action
        uses: .
        continue-on-error: true
        with:
          jamf_url: "http://localhost:9999"
          jamf_username: "testuser"
          jamf_password: "testpassword"
          script_dir: "scripts"
          script_extensions: "sh"
          prefix: "false"
          delete: "false"

      - name: Assert action ran without a startup or import error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action uses @logger.catch which swallows connection errors and
          # exits 0. A 'success' or 'failure' outcome both indicate the Docker
          # container started and the Python script ran (not a build/import error).
          # We accept either outcome — the key check is that it is not 'cancelled'.
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME) — Docker container started and Python script executed"
