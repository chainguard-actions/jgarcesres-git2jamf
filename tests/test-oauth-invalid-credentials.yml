name: Test oauth auth type with invalid credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with oauth auth type and invalid credentials
        id: action
        uses: .
        with:
          jamf_url: "https://invalid.jamfcloud.com"
          jamf_username: "test-client-id"
          jamf_password: "test-client-secret"
          jamf_auth_type: "oauth"
          script_dir: ${{ github.workspace }}
          script_extensions: "sh py"
          prefix: "false"
          delete: "false"
      - name: Assert action completed with oauth auth type
        run: |
          echo "PASS: action ran to completion with invalid oauth credentials"
          echo "The Python script uses @logger.catch which catches connection errors and exits 0"
