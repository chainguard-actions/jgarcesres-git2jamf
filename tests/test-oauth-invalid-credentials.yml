name: Test oauth auth type with invalid credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          jamf_url: 'https://invalid.jamf.example.com'
          jamf_username: 'fake-client-id'
          jamf_password: 'fake-client-secret'
          jamf_auth_type: 'oauth'
          script_dir: '${{ github.workspace }}'
          script_extensions: 'sh py'
          prefix: 'false'
          delete: 'false'

      - name: Assert action completed despite invalid oauth credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action uses @logger.catch which swallows ConnectionError exceptions.
          # When given an invalid Jamf URL with oauth auth, the action logs errors
          # but exits 0 (success) because exceptions are caught and not re-raised.
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to exit 0 (success) since errors are swallowed by @logger.catch, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action completed with exit 0 as expected when given invalid oauth credentials"
