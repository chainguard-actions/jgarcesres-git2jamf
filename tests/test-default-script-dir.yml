name: Test default script directory (github.workspace)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a test script in workspace
        run: |
          echo '#!/bin/bash\necho workspace-script' > "$GITHUB_WORKSPACE/workspace-test.sh"
      - id: action
        uses: .
        continue-on-error: true
        with:
          jamf_url: "http://localhost:8080"
          jamf_username: "testuser"
          jamf_password: "testpassword"
          script_extensions: "sh"
          prefix: "false"
          delete: "false"
      - name: Assert action ran with default script_dir
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should fail because JAMF is not available
          # We expect 'failure' since there's no real JAMF instance
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (no JAMF instance available)"
          else
            echo "PASS: action ran (outcome: $OUTCOME)"
          fi
      - name: Cleanup test script
        if: always()
        run: |
          rm -f "$GITHUB_WORKSPACE/workspace-test.sh"
